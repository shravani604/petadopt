<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Grooming Services - PetAdopt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-step { display: none; }
        .form-step.active { display: block; }
        .choice-box { border: 1px solid #ddd; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .choice-box.selected { border-color: #6a11cb; background-color: #f3e5f5; }
        .package-card { border: 1px solid #ddd; border-radius: 15px; padding: 20px; height: 100%; display: flex; flex-direction: column; }
        .package-card ul { list-style: none; padding-left: 0; flex-grow: 1; }
        .price { font-size: 1.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg lavender-gradient"><div class="container"><a class="navbar-brand fw-bold fs-3" href="index.html">🐾 PetAdopt</a></div></nav>

    <div class="container my-5">
        <!-- STEP 1: ADD PET DETAILS -->
        <div id="step1" class="form-step active card p-4 shadow-lg">
            <h2 class="text-center fw-bold mb-4">Add Pet Details</h2>
            <form id="petDetailsForm">
                <p class="fw-bold">What type of pet?</p>
                <div class="row mb-3" data-group="petType"><div class="col"><div class="choice-box" data-value="Cat">🐱 Cat</div></div><div class="col"><div class="choice-box" data-value="Dog">🐶 Dog</div></div></div>
                <div class="mb-3"><label for="petName" class="form-label fw-bold">Name of pet?</label><input type="text" class="form-control" id="petName" required></div>
                <p class="fw-bold">Gender?</p>
                <div class="row mb-3" data-group="petGender"><div class="col"><div class="choice-box" data-value="Female">Female</div></div><div class="col"><div class="choice-box" data-value="Male">Male</div></div></div>
                <p class="fw-bold">Size?</p>
                <div class="row mb-3" data-group="petSize"><div class="col"><div class="choice-box" data-value="Small">Small</div></div><div class="col"><div class="choice-box" data-value="Medium">Medium</div></div><div class="col"><div class="choice-box" data-value="Large">Large</div></div></div>
                <p class="fw-bold">Aggression?</p>
                <div class="row mb-3" data-group="petAggression"><div class="col"><div class="choice-box" data-value="Low">Low</div></div><div class="col"><div class="choice-box" data-value="Normal">Normal</div></div><div class="col"><div class="choice-box" data-value="High">High</div></div></div>
                <p class="fw-bold">Age?</p>
                <div class="row mb-4" data-group="petAge"><div class="col"><div class="choice-box" data-value="< 3 Months">&lt; 3 Months</div></div><div class="col"><div class="choice-box" data-value="< 11 Years">&lt; 11 Years</div></div><div class="col"><div class="choice-box" data-value="11+ Years">11+ Years</div></div></div>
                <button type="submit" class="btn btn-gradient w-100">Next</button>
            </form>
        </div>

        <!-- STEP 2: SELECT CITY -->
        <div id="step2" class="form-step card p-4 shadow-lg text-center">
            <h2 class="text-center fw-bold mb-4">Please select your city</h2>
            <select class="form-select" id="citySelect">
                <option selected disabled>-- Select a City --</option>
                <option>Delhi</option>
                <option>Mumbai</option>
                <option>Bangalore</option>
            </select>
        </div>

        <!-- STEP 3: VIEW PACKAGES & BOOK -->
        <div id="step3" class="form-step">
            <h2 class="text-center fw-bold mb-3">Grooming Packages in <span id="cityName"></span></h2>
            <div class="row g-4" id="packageList">
                <!-- Packages will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Booking Modal (Pop-up Form) -->
    <div class="modal fade" id="bookingModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirm Booking: <span id="modalPackageName"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="finalBookingForm"><div class="mb-3"><label for="preferredDate" class="form-label">Select Date</label><input type="date" class="form-control" id="preferredDate" required></div><button type="submit" class="btn btn-gradient w-100">Request Appointment</button></form></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- SETUP ---
        const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];
        let currentStep = 0;
        let bookingDetails = {};
        const bookingModal = new bootstrap.Modal(document.getElementById('bookingModal'));
        const dateInput = document.getElementById('preferredDate');

        // --- FUNCTIONS ---
        function goToStep(stepIndex) {
            if (steps[currentStep]) steps[currentStep].classList.remove('active');
            if (steps[stepIndex]) steps[stepIndex].classList.add('active');
            currentStep = stepIndex;
        }

        function generatePackageCards(city) {
            const prices = {
                Delhi: { spa: 899, basic: 1399, full: 1899 },
                Mumbai: { spa: 999, basic: 1499, full: 1999 },
                Bangalore: { spa: 1099, basic: 1599, full: 2099 }
            };
            const cityPrices = prices[city] || prices.Mumbai;
            const packageContainer = document.getElementById('packageList');
            packageContainer.innerHTML = `
                <div class="col-md-4"><div class="package-card"><h4>Spa Bath</h4><p class="price">₹${cityPrices.spa}</p><ul class="text-start"><li><i class="bi bi-check-circle-fill text-success"></i> Bath & Shampoo</li><li><i class="bi bi-check-circle-fill text-success"></i> Nail Clipping</li></ul><button class="btn btn-gradient w-100 mt-auto book-now-btn" data-package-name="Spa Bath" data-price="${cityPrices.spa}">Book Now</button></div></div>
                <div class="col-md-4"><div class="package-card"><h4>Bath + Basic</h4><p class="price">₹${cityPrices.basic}</p><ul class="text-start"><li><i class="bi bi-check-circle-fill text-success"></i> All from Spa Bath</li><li><i class="bi bi-check-circle-fill text-success"></i> Sanitary Trim</li></ul><button class="btn btn-gradient w-100 mt-auto book-now-btn" data-package-name="Bath + Basic" data-price="${cityPrices.basic}">Book Now</button></div></div>
                <div class="col-md-4"><div class="package-card"><h4>Full Service</h4><p class="price">₹${cityPrices.full}</p><ul class="text-start"><li><i class="bi bi-check-circle-fill text-success"></i> All from Bath + Basic</li><li><i class="bi bi-check-circle-fill text-success"></i> Full Body Trimming</li></ul><button class="btn btn-gradient w-100 mt-auto book-now-btn" data-package-name="Full Service" data-price="${cityPrices.full}">Book Now</button></div></div>`;
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
        });

        document.querySelectorAll('.choice-box').forEach(box => {
            box.addEventListener('click', () => {
                const group = box.closest('[data-group]').dataset.group;
                bookingDetails[group] = box.dataset.value;
                document.querySelectorAll(`[data-group="${group}"] .choice-box`).forEach(b => b.classList.remove('selected'));
                box.classList.add('selected');
            });
        });

        document.getElementById('petDetailsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            bookingDetails.petName = document.getElementById('petName').value;
            if (!bookingDetails.petType || !bookingDetails.petName) { alert("Please select a pet type and enter a name."); return; }
            goToStep(1);
        });

        document.getElementById('citySelect').addEventListener('change', (e) => {
            const city = e.target.value;
            bookingDetails.city = city;
            document.getElementById('cityName').textContent = city;
            generatePackageCards(city);
            goToStep(2);
        });
        
        document.getElementById('packageList').addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('book-now-btn')) {
                if (!localStorage.getItem("petAdoptUser")) { alert("Please log in first."); window.location.href = 'login.html'; return; }
                bookingDetails.groomingPackage = e.target.dataset.packageName;
                bookingDetails.price = e.target.dataset.price;
                document.getElementById('modalPackageName').textContent = bookingDetails.groomingPackage;
                bookingModal.show();
            }
        });

        document.getElementById('finalBookingForm').addEventListener("submit", async function(e) {
            e.preventDefault();
            bookingDetails.preferredDate = dateInput.value;
            const user = JSON.parse(localStorage.getItem("petAdoptUser"));
            const finalRequestData = { ...bookingDetails, ownerName: user.name, ownerEmail: user.email, ownerPhone: user.phone };

            try {
                const response = await fetch('http://localhost:3000/api/grooming-requests', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(finalRequestData)
                });
                if (response.ok) {
                    bookingModal.hide();
                    setTimeout(() => { window.location.href = "thankyou-booking.html"; }, 500);
                } else { alert(`Booking Failed.`); }
            } catch (error) { alert("Could not connect."); }
        });
    </script>
</body>
</html>
