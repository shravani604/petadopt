
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Details - PetAdopt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pet-profile { background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .pet-image { 
    height: 300px;
    width: 100%; 
    object-fit: contain; /* Fits the whole image inside */
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-lg lavender-gradient">
  <div class="container"><a class="navbar-brand fw-bold fs-3" href="index.html">🐾 PetAdopt</a></div>
</nav>

<!-- Pet Profile -->
<section class="py-5">
  <div class="container">
    <div class="pet-profile">
      <div class="row align-items-center">
        <div class="col-md-5 text-center mb-4 mb-md-0"><img id="dogImage" src="" alt="Pet Image" class="pet-image"></div>
        <div class="col-md-7">
          <h2 id="dogName" class="fw-bold mb-3"></h2>
          <p class="mb-2"><strong>Breed:</strong> <span id="dogBreed"></span></p>
          <p class="mb-2"><strong>Age:</strong> <span id="dogAge"></span></p>
          <p class="mb-2"><strong>Gender:</strong> <span id="dogGender"></span></p>
          <p class="mb-2"><strong>Allergies:</strong> <span id="dogAllergies"></span></p>
          <p class="mb-4"><strong>Description:</strong> <span id="dogDescription"></span></p>
        </div>
        <div class="col-12">
            <hr class="my-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 shadow-lg">
                        <h3 class="text-center fw-bold mb-4">Ready to Adopt?</h3>
                        <form id="adoptionForm">
                            <h5 class="mt-4 mb-3">Your Details</h5>
                            <div class="mb-3"><label class="form-label">Full Address</label><input type="text" class="form-control" id="applicantAddress" required></div>
                            <h5 class="mt-4 mb-3">Your Home</h5>
                            <div class="mb-3"><label class="form-label">Living situation?</label><select class="form-select" id="livingSituation" required><option value="" selected disabled>-- Select --</option><option value="Own House">Own House</option><option value="Rent Apartment">Rent Apartment</option><option value="Other">Other</option></select></div>
                            <div class="row"><div class="col-md-6 mb-3"><label class="form-label">People in household?</label><input type="number" class="form-control" id="householdMembers" required min="1" value="1"></div><div class="col-md-6 mb-3"><label class="form-label">Children in home?</label><div class="form-check"><input class="form-check-input" type="radio" name="hasChildren" id="childrenYes" value="true" required><label class="form-check-label" for="childrenYes">Yes</label></div><div class="form-check"><input class="form-check-input" type="radio" name="hasChildren" id="childrenNo" value="false" required><label class="form-check-label" for="childrenNo">No</label></div></div></div>
                            <h5 class="mt-4 mb-3">Your Experience</h5>
                            <div class="mb-3"><label class="form-label">Experience with pets?</label><textarea class="form-control" id="previousPetExperience" rows="4" required></textarea></div>
                            <div class="mb-4"><label class="form-label">Why this pet?</label><textarea class="form-control" id="reason" rows="4" required></textarea></div>
                            <button type="submit" class="btn btn-gradient w-100 btn-lg">Submit Application</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Success Modal Pop-up -->
<div class="modal fade" id="successModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content text-center p-4"><div class="modal-body"><i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i><h5 class="modal-title mt-3 fw-bold">Application Submitted!</h5><p class="text-muted mt-2">The shelter has received your application and will be in touch soon.</p><button type="button" class="btn btn-gradient mt-3" id="backToHomeBtn">Back to Homepage</button></div></div></div></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // This function runs once the HTML is fully loaded
  document.addEventListener('DOMContentLoaded', () => {
    // --- PART 1: Display Pet Details ---
    const name = localStorage.getItem("dogName");
    const breed = localStorage.getItem("dogBreed");
    const age = localStorage.getItem("dogAge");
    const gender = localStorage.getItem("dogGender");
    const allergies = localStorage.getItem("dogAllergies");
    const description = localStorage.getItem("dogDescription");
    const image = localStorage.getItem("dogImage");
    if (name) {
      document.getElementById("dogName").textContent = name;
      document.getElementById("dogBreed").textContent = breed;
      document.getElementById("dogAge").textContent = age;
      document.getElementById("dogGender").textContent = gender;
      document.getElementById("dogAllergies").textContent = allergies;
      document.getElementById("dogDescription").textContent = description;
      document.getElementById("dogImage").src = image;
    } else {
      document.querySelector('.pet-profile').innerHTML = '<h2 class="text-center">No pet details found.</h2>';
    }

    // --- PART 2: Set up the Adoption Form Submission ---
    const adoptionForm = document.getElementById("adoptionForm");
    adoptionForm.addEventListener("submit", async function(e) {
        e.preventDefault();
        const user = JSON.parse(localStorage.getItem("petAdoptUser"));
        if (!user) { alert("Please log in first."); window.location.href = "login.html"; return; }
        
        const selectedChildrenOption = document.querySelector('input[name="hasChildren"]:checked');
        if (!document.getElementById("applicantAddress").value || !document.getElementById("livingSituation").value || !selectedChildrenOption) {
            alert("Please fill out all required fields."); return;
        }

        const requestData = {
            petId: localStorage.getItem("dogId"), petName: localStorage.getItem("dogName"),
            userId: user.email, userName: user.name, userEmail: user.email, userPhone: user.phone,
            applicantAddress: document.getElementById("applicantAddress").value,
            livingSituation: document.getElementById("livingSituation").value,
            householdMembers: document.getElementById("householdMembers").value,
            hasChildren: selectedChildrenOption.value,
            previousPetExperience: document.getElementById("previousPetExperience").value,
            reason: document.getElementById("reason").value
        };

        try {
            const response = await fetch('http://localhost:3000/api/adoption-requests', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestData)
            });
            const result = await response.json();
            if (response.ok) {
                const successModal = new bootstrap.Modal(document.getElementById('successModal'));
                successModal.show();
            } else { alert(`Submission Failed: ${result.message}`); }
        } catch (error) { alert("Could not connect to the server. Please ensure the server is running."); }
    });

    // --- PART 3: Set up the Modal's "Back to Home" button ---
    document.getElementById("backToHomeBtn").addEventListener("click", function() {
        window.location.href = "index.html";
    });
  });
</script>

</body>
</html>
