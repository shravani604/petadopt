<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Account - PetAdopt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-items-center vh-100 form-bg">
        <div class="form-container p-5 rounded shadow-lg text-center">
            <h2 class="fw-bold mb-3">Check Your Email</h2>
            <p class="text-muted">We've sent a 6-digit verification code to the email address you provided.</p>
            <form id="otpForm">
                <div class="mb-3">
                    <label for="otp" class="form-label">Enter OTP</label>
                    <input type="text" class="form-control text-center" id="otp" required maxlength="6">
                </div>
                <button type="submit" class="btn btn-gradient w-100">Verify Account</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("otpForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const otp = document.getElementById("otp").value;
            const email = localStorage.getItem("userEmailForVerification");

            if (!email) {
                alert("Could not find email for verification. Please try registering again.");
                window.location.href = "registration.html";
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                    localStorage.removeItem("userEmailForVerification"); // Clean up
                    window.location.href = "login.html";
                } else {
                    alert(`Verification Failed: ${result.message}`);
                }
            } catch (error) {
                alert("Could not connect to the server.");
            }
        });
    </script>
</body>
</html>
