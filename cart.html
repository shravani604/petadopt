<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - PetAdopt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg lavender-gradient">
      <div class="container"><a class="navbar-brand fw-bold fs-3" href="index.html">🐾 PetAdopt</a></div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center fw-bold mb-4">Your Shopping Cart</h1>
        <div class="row">
            <!-- Cart Items -->
            <div class="col-md-8">
                <div id="cart-items-container">
                    <!-- Cart items will be generated by JavaScript here -->
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h4 class="fw-bold">Order Summary</h4>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Subtotal</span>
                            <strong id="subtotal">₹0</strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Delivery Charges</span>
                            <strong id="delivery-charges">₹50</strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Total</span>
                            <strong id="total-amount" class="fs-5">₹50</strong>
                        </li>
                    </ul>
                    <button id="checkout-btn" class="btn btn-gradient w-100 mt-3">Proceed to Payment</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cartItemsContainer = document.getElementById('cart-items-container');
        const subtotalEl = document.getElementById('subtotal');
        const deliveryChargesEl = document.getElementById('delivery-charges');
        const totalAmountEl = document.getElementById('total-amount');
        const checkoutBtn = document.getElementById('checkout-btn');
        
        let cart = JSON.parse(localStorage.getItem('petAccessoryCart')) || [];
        const deliveryCharges = 50;

        // This function runs when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            displayCartItems();
            updateOrderSummary();
        });

        function displayCartItems() {
            cartItemsContainer.innerHTML = ''; // Clear old items
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
                checkoutBtn.disabled = true;
                return;
            }

            cart.forEach((item, index) => {
                cartItemsContainer.innerHTML += `
                    <div class="card mb-3">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h5>${item.name}</h5>
                                <p class="mb-0"><strong>Price:</strong> ₹${item.price}</p>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function updateOrderSummary() {
            const subtotal = cart.reduce((total, item) => total + item.price, 0);
            const totalAmount = subtotal + deliveryCharges;

            subtotalEl.textContent = `₹${subtotal}`;
            totalAmountEl.textContent = `₹${totalAmount}`;
        }

        function removeItem(index) {
            cart.splice(index, 1); // Remove the item from the array
            localStorage.setItem('petAccessoryCart', JSON.stringify(cart)); // Update localStorage
            displayCartItems(); // Re-render the cart
            updateOrderSummary(); // Re-calculate the total
        }

        // --- RAZORPAY PAYMENT LOGIC ---
        checkoutBtn.addEventListener('click', function() {
            const user = JSON.parse(localStorage.getItem("petAdoptUser"));
            if (!user) {
                alert("Please log in to proceed with the payment.");
                window.location.href = "login.html";
                return;
            }

            const totalAmount = cart.reduce((total, item) => total + item.price, 0) + deliveryCharges;

            var options = {
                "key": "YOUR_RAZORPAY_KEY_ID", // ⭐ PASTE YOUR RAZORPAY KEY ID HERE ⭐
                "amount": totalAmount * 100, // Amount in paise
                "currency": "INR",
                "name": "PetAdopt Accessories",
                "description": "Payment for pet products",
                "handler": function (response){
                    alert("Payment successful! Payment ID: " + response.razorpay_payment_id);
                    // Clear the cart after successful payment
                    localStorage.removeItem('petAccessoryCart');
                    // Redirect to a thank you page
                    window.location.href = "thankyou-booking.html";
                },
                "prefill": {
                    "name": user.name,
                    "email": user.email,
                    "contact": user.phone
                },
                "theme": { "color": "#6a11cb" }
            };
            
            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
            });
            rzp1.open();
        });
    </script>
</body>
</html>
