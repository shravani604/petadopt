<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PetAdopt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-items-center vh-100 form-bg">
        <div class="form-container p-5 rounded shadow-lg">
            <h2 class="text-center fw-bold mb-4">Welcome Back!</h2>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-gradient w-100">Login</button>
            </form>

            <div class="text-center mt-4">
                <p>New to PetAdopt? <a href="registration.html">Create an account</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault(); // Stop the form from reloading the page

            const loginData = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            try {
                // Send the login data to our new server endpoint
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                const result = await response.json();

                if (response.ok) {
                    // If login was successful, save user to localStorage
                    alert(result.message);
                    localStorage.setItem("petAdoptUser", JSON.stringify(result.user));
                    // Redirect to the homepage
                    window.location.href = "index.html";
                } else {
                    // If server sent an error (e.g., wrong password)
                    alert(`Login Failed: ${result.message}`);
                }
            } catch (error) {
                // If there was a network error
                alert("Could not connect to the server. Please try again later.");
            }
        });
    </script>
</body>
</html>
