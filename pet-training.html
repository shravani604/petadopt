<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Training - PetAdopt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg lavender-gradient">
      <div class="container"><a class="navbar-brand fw-bold fs-3" href="index.html">🐾 PetAdopt</a></div>
    </nav>

    <!-- Training Form -->
    <div class="container my-5">
        <div class="col-md-8 mx-auto card p-4 shadow">
            <h2 class="text-center fw-bold mb-4">Book a Training Session</h2>
            <form id="trainingForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Pet Type</label>
                        <select class="form-select" id="petType" required>
                            <option value="" selected disabled>-- Select Pet Type --</option>
                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="petAge" class="form-label">Pet's Age</label>
                        <input type="text" class="form-control" id="petAge" placeholder="e.g., 6 months, 2 years" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Type of Training</label>
                    <select class="form-select" id="trainingType" required>
                        <option value="" selected disabled>-- Select Training --</option>
                        <option value="Puppy Training">Puppy Training (Basics)</option>
                        <option value="Obedience Training">Obedience Training (Intermediate)</option>
                        <option value="Behavioral Issues">Behavioral Issues (e.g., barking, anxiety)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="specificIssues" class="form-label">Specific Issues (Optional)</label>
                    <textarea class="form-control" id="specificIssues" rows="3" placeholder="Tell us more about the issues you're facing..."></textarea>
                </div>
                <div class="alert alert-info">Your registered contact details will be used for this booking.</div>
                <button type="submit" class="btn btn-gradient w-100">Request Session</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("trainingForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem("petAdoptUser"));
            if (!user) {
                alert("Please log in to book a session.");
                window.location.href = "login.html";
                return;
            }

            const requestData = {
                petType: document.getElementById("petType").value,
                petAge: document.getElementById("petAge").value,
                trainingType: document.getElementById("trainingType").value,
                specificIssues: document.getElementById("specificIssues").value,
                ownerName: user.name,
                ownerEmail: user.email,
                ownerPhone: user.phone
            };

            try {
                const response = await fetch('http://localhost:3000/api/training-requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });
                const result = await response.json();
                if (response.ok) {
                    // Redirect to the same thank you page
                    window.location.href = "thankyou-booking.html";
                } else { alert(`Booking Failed: ${result.message}`); }
            } catch (error) { alert("Could not connect to the server."); }
        });
    </script>
</body>
</html>
